<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Silly Story Generator</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: darkblue;
    }

    div {
      margin: 15px;
    }

    label {
      font-weight: bold;
    }

    input {
      padding: 5px;
    }

    button {
      background-color: orange;
      color: white;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
    }

    button:hover {
      background-color: darkorange;
    }

    .story {
      background-color: white;
      width: 500px;
      margin: 20px auto;
      padding: 15px;
      border: 3px solid darkblue;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Silly Story Generator</h1>

  <div>
    <label for="customname">Enter name:</label>
    <input id="customname" type="text">
  </div>

  <div>
    <label for="us">US</label><input id="us" type="radio" name="ukus" value="us" checked>
    <label for="uk">UK</label><input id="uk" type="radio" name="ukus" value="uk">
  </div>

  <div>
    <button class="randomize">Generate random story</button>
  </div>

  <p class="story"></p>

  <script>
    const customName = document.getElementById('customname');
    const randomize = document.querySelector('.randomize');
    const story = document.querySelector('.story');

    function randomValueFromArray(array) {
      const random = Math.floor(Math.random() * array.length);
      return array[random];
    }

    const storyText = 'It was 94 fahrenheit at the school talent show, so :insertx: decided to perform outside. When they got to :inserty:, the crowd went silent, and then :insertx: :insertz:. Bob was not surprised, because :insertx: had just eaten 300 pounds of spaghetti.';

    const insertX = ['Captain Waffles', 'Grandma Turbo', 'a disco llama'];
    const insertY = ['the bowling alley', 'the school cafeteria', 'the parking lot'];
    const insertZ = ['started dancing', 'turned into a pigeon and flew away', 'sang opera to a vending machine'];

    randomize.addEventListener('click', result);

    function result() {
      let newStory = storyText;

      const xItem = randomValueFromArray(insertX);
      const yItem = randomValueFromArray(insertY);
      const zItem = randomValueFromArray(insertZ);

      newStory = newStory.replaceAll(':insertx:', xItem);
      newStory = newStory.replaceAll(':inserty:', yItem);
      newStory = newStory.replaceAll(':insertz:', zItem);

      if (customName.value !== '') {
        const name = customName.value;
        newStory = newStory.replaceAll('Bob', name);
      }

      if (document.getElementById('uk').checked) {
        const weight = Math.round(300 / 14) + ' stone';
        const temperature = Math.round((94 - 32) * 5 / 9) + ' centigrade';
        newStory = newStory.replaceAll('94 fahrenheit', temperature);
        newStory = newStory.replaceAll('300 pounds', weight);
      }

      story.textContent = newStory;
      story.style.visibility = 'visible';
    }
  </script>
</body>
</html>
